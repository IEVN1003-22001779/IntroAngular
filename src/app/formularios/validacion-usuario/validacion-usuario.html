<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-primary shadow-lg rounded-4 overflow-hidden">
                <div class="bg-primary p-4 text-center text-white">
                    <h4 class="mb-0">Validación a Usuarios</h4>
                </div>
                
                <div class="card-body p-4 p-md-5 bg-white">
                    <div class="form-floating mb-3">
                        <input [(ngModel)]="usuario" type="text" class="form-control" id="usuario" placeholder="Usuario">
                        <label for="usuario" class="text-muted">Usuario</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input [(ngModel)]="contrasena" type="password" class="form-control" id="contraseña" placeholder="Contraseña">
                        <label for="contraseña" class="text-muted">Contraseña</label>
                    </div>
                    
                    <button (click)="iniciarSesion()" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm">
                        Iniciar Sesión
                    </button>
                    
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="fs-5 fw-bold text-dark mb-0">
                            {{ mensaje || 'Ingresa tu usuario y contraseña.' }} <!-- los || son para mostrar un mensaje por defecto si está vacía -->
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
