<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12 text-center text-md-start">
            <h3 class="text-primary border-bottom pb-2">
                ¿Tu Palabra Puede Ser Un Palíndromo?
            </h3>
        </div>
    </div>

    <div class="row align-items-stretch">
        
        <div class="col-md-5 mb-4">
            <div class="card h-100 p-4 border-0 shadow-sm bg-light">
                <div class="card-body d-flex flex-column p-0">
                    
                    <div class="form-group mb-4">
                        <label for="fraseEntrada" class="mb-2"><b>Ingresa la palabra deseada:</b></label>
                        <input [(ngModel)]="texto" type="text" class="form-control form-control-lg" id="fraseEntrada" placeholder="Escribe tu palabra">
                    </div>
                    
                    <button (click)="analizarFrase()" type="button" class="btn btn-danger btn-lg w-100 mt-auto shadow-sm">
                        Ver Respuesta
                    </button>
                    
                </div>
            </div>
        </div>

        <div class="col-md-7 mb-4">
            <div class="card h-100 p-3 border-0 shadow-sm text-center">
                <div class="card-body d-flex flex-column justify-content-center">
                    <h4 class="text-danger mb-4 fw-bold">{{ resultado }}</h4>
                    
                    <hr class="my-3">

                    <div class="row mt-2">
                        <div class="col-6">
                            <div class="p-3 border rounded bg-white shadow-sm">
                                <h5>Vocales</h5>
                                <h3 class="text-success mb-0 fw-bold">{{ vocales }}</h3>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="p-3 border rounded bg-white shadow-sm">
                                <h5>Consonantes</h5>
                                <h3 class="text-success mb-0 fw-bold">{{ consonantes }}</h3>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>
